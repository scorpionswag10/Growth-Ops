name: Test API container startup (temporary investigation)

# Runs Dockerfile.api in the exact GH Actions Docker sandbox that already
# builds it for real deploys — but only runs/health-checks it here, never
# touches Cloudflare. Only fires on this investigation branch.

on:
  push:
    branches: [seo-investigation]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Push schema to ephemeral Postgres
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DIRECT_DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: npx prisma db push --skip-generate

      - name: Build the real container image
        run: docker build -f Dockerfile.api -t test-api-image .

      - name: Run container and check it actually starts
        run: |
          docker run -d --name test-container --network host \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test" \
            -e JWT_SECRET=test-secret-value \
            -e REDIS_URL="redis://localhost:6380" \
            test-api-image

          sleep 3
          echo "=== Initial container logs ==="
          docker logs test-container || true

          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then
              echo ""
              echo "RESULT: HEALTHY on attempt $i"
              docker logs test-container
              exit 0
            fi
            STATUS=$(docker inspect -f '{{.State.Status}}' test-container 2>&1 || echo "gone")
            EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' test-container 2>&1 || echo "?")
            echo "attempt $i: container status=$STATUS exitCode=$EXIT_CODE, not healthy yet"
            if [ "$STATUS" != "running" ]; then
              echo ""
              echo "RESULT: CONTAINER EXITED/CRASHED (status=$STATUS, exitCode=$EXIT_CODE)"
              docker logs test-container
              exit 1
            fi
            sleep 3
          done

          echo ""
          echo "RESULT: TIMED OUT waiting for health, container still running but never bound the port"
          docker logs test-container
          exit 1
